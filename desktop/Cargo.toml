[package]
name = "candysign-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.9.0"
anyhow = "1"
async-channel = "2"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "NSScreen"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
